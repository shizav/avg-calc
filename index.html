<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Undergraduate Average Calculator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1>Undergraduate Average Calculator</h1>
    <p class="subtitle">Add each course's credit points and grade to see your weighted average.</p>

    <form id="course-form" class="course-form" novalidate>
      <div class="field">
        <label for="course-name">Course name</label>
        <input type="text" id="course-name" name="course-name" placeholder="e.g. Calculus 1" required />
      </div>
      <div class="field">
        <label for="course-credits">Credit points</label>
        <input type="number" id="course-credits" name="course-credits" min="0" step="0.5" placeholder="e.g. 5" required />
      </div>
      <div class="field">
        <label for="course-grade">Grade</label>
        <input type="number" id="course-grade" name="course-grade" min="0" max="100" step="0.1" placeholder="e.g. 90" required />
      </div>
      <button type="submit" class="btn btn-add">Add course</button>
    </form>

    <p id="form-error" class="error" role="alert" hidden></p>

    <table class="course-table">
      <thead>
        <tr>
          <th>Course</th>
          <th>Credits</th>
          <th>Grade</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="course-list">
        <!-- rows injected by app.js -->
      </tbody>
    </table>

    <p id="empty-state" class="empty-state">No courses added yet.</p>

    <div class="actions">
      <button type="button" id="calculate-btn" class="btn btn-calculate">Calculate</button>
      <button type="button" id="clear-btn" class="btn btn-clear">Clear all</button>
    </div>

    <div id="result" class="result" hidden></div>
  </main>

  <script src="app.js"></script>
</body>
</html>
